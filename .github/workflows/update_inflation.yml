name: Update inflation data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update Russian CPI
        run: python scripts/update_russia_cpi.py

      - name: Update US inflation
        run: python scripts/update_us_inflation.py

      - name: Update CBR inflation
        run: python scripts/update_cbr_inflation.py

      - name: Save updated CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update inflation data"
          git push
