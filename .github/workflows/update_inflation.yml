name: Update inflation data

on:
  workflow_dispatch:

  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update Russian CPI
        run: python scripts/update_russia_cpi.py
        
      - name: Update Sheet 4 rates and oil
        run: python scripts/sheet_04_rates_oil_py/update_sheet_04.py

      - name: Update Sheet 6 export import and current account
        run: python scripts/sheet_06_exp_imp_py/update_sheet_06.py

      - name: Update US inflation
        run: python scripts/update_us_inflation.py

      - name: Update CBR inflation
        run: python scripts/update_cbr_inflation.py

      - name: Update Sheet 3A key rate and inflation forecast
        run: python scripts/sheet_03a_keyrate_inflation/update_cbr_medium_term_forecast.py
        
      - name: Update Eurozone inflation
        run: python scripts/update_euro_inflation.py

      - name: Update Russian quarterly CPI
        run: python scripts/update_russia_cpi_quarterly.py
      
      - name: Update Russian GDP
        run: python scripts/sheet_01_gdp_py/update_russia_gdp.py
        
      - name: Update Russian average population
        run: python scripts/sheet_01_gdp_py/update_average_population.py
          
      - name: Update Russian credit impulse
        run: python scripts/sheet_01_gdp_py/update_credit_impulse.py

      - name: Update Russian extended debt
        run: python scripts/sheet_01_gdp_py/update_extended_debt.py

      - name: Update Russian nominal quarterly GDP
        run: python scripts/sheet_01_gdp_py/update_gdp_nominal_quarterly.py

      - name: Update Russian labor productivity
        run: python scripts/sheet_01_gdp_py/update_labor_productivity.py

      - name: Update Russian loss-making companies
        run: python scripts/sheet_01_gdp_py/update_loss_making_companies.py

      - name: Update World Bank GDP per capita
        run: python scripts/sheet_01_gdp_py/update_world_bank_gdp_per_capita.py

      - name: Update Russian real disposable income
        run: python scripts/sheet_01_gdp_py/update_real_disposable_income.py

      - name: Update Russian business activity expectations
        run: python scripts/sheet_2_ipp_py/update_business_expectations.py

      - name: Update Russian industrial production
        run: python scripts/sheet_2_ipp_py/update_russia_ipp.py

      - name: Update Russian real income
        run: python scripts/sheet_05_income_unemployment_py/update_real_income.py

      - name: Update Russian real wage
        run: python scripts/sheet_05_income_unemployment_py/update_real_wage.py

      - name: Update Russian household debt service ratio
        run: python scripts/sheet_05_income_unemployment_py/update_russia_household_debt_service_ratio.py

      - name: Update Russian unemployment
        run: python scripts/sheet_05_income_unemployment_py/update_unemployment.py
        
      - name: Validate inflation datasets
        run: python scripts/validate_inflation_outputs.py
        
      - name: Save updated CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No data changes to save."
          else
            git commit -m "Update inflation data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
