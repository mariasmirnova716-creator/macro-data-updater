name: Update inflation data

on:
  workflow_dispatch:

  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update Russian CPI
        run: python scripts/update_russia_cpi.py

      - name: Update US inflation
        run: python scripts/update_us_inflation.py

      - name: Update CBR inflation
        run: python scripts/update_cbr_inflation.py
        
      - name: Update Eurozone inflation
        run: python scripts/update_euro_inflation.py

      - name: Update Russian quarterly CPI
        run: python scripts/update_russia_cpi_quarterly.py
      
      - name: Update Russian GDP
        run: python scripts/sheet_01_gdp_py/update_russia_gdp.py

      - name: Update World Bank GDP per capita
        run: python scripts/sheet_01_gdp_py/update_world_bank_gdp_per_capita.py

      - name: Update Russian industrial production
        run: python scripts/sheet_2_ipp_py/update_russia_ipp.py
        
      - name: Validate inflation datasets
        run: python scripts/validate_inflation_outputs.py
        
      - name: Save updated CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No data changes to save."
          else
            git commit -m "Update inflation data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
